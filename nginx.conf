server {
  listen 80;
  server_name wr506.theo-birost.fr;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # ADDED: This block handles API requests
  # It forwards any request starting with /api/ to your backend service.
  location /api/ {
    # IMPORTANT: 'http://backend' is a placeholder.
    # You may need to replace 'backend' with the actual name of your
    # PHP/Symfony service as defined in your docker-compose.yml file.
    proxy_pass http://wr506.theo-birost.fr;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
